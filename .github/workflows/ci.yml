name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: the secrets job downloads and executes an
# external binary and must not inherit a writable token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/

      - name: Test
        run: uv run pytest

  # Merge-blocking secret scan (dev-ops standard §5). Pinned binary + checksum,
  # working-tree only. The run block is copied verbatim from sanskai-hq/privacy
  # ci.yml (the org ci-python.yml template pins the same binary + checksum but
  # lacks `--fail --retry`; keep the privacy form). Retrofitted 2026-08-28
  # (sanskai-hq/dev-ops#41).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: gitleaks scan (working tree)
        run: |
          curl -sSL --fail --retry 3 --retry-delay 2 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --no-banner --redact

  # Terminal aggregator (org standard, copied from sanskai-hq/repo-template):
  # gives the main-protection ruleset ONE stable required-check name regardless
  # of which jobs ran. Skipped jobs are fine; anything failed or cancelled
  # fails this job. No path filters anywhere in this workflow — a required
  # check that never reports blocks the PR forever. Do NOT add `name:` to this
  # job: the job id `all-checks-passed` is the required-check context that the
  # main-protection ruleset and dev-ops security-baseline.sh key on.
  all-checks-passed:
    needs: [test, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: verify no needed job failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed or was cancelled:"
            echo '${{ toJSON(needs.*.result) }}'
            exit 1
          fi
          echo "all checks passed"
